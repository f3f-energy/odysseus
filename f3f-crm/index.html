<title>F3F Energy CRM</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: barra lateral fixa de módulos + área de trabalho com cabeçalho de busca. Tema escuro primeiro, ambar "solar" como destaque, verde-agua para dados. */
:root{
  --bg:#0c1013; --panel:#131a1f; --panel-2:#192228; --line:#253039; --line-2:#31404b;
  --fg:#e5ecef; --muted:#8a9aa5; --faint:#5d6d78;
  --accent:#f2a627; --accent-ink:#1b1204; --accent-soft:rgba(242,166,39,.14); --accent-text:#f5b545;
  --volt:#3cc4bb; --volt-soft:rgba(60,196,187,.14);
  --ok:#47c08a; --ok-soft:rgba(71,192,138,.15);
  --warn:#eab03a; --warn-soft:rgba(234,176,58,.16);
  --bad:#ee6262; --bad-soft:rgba(238,98,98,.16);
  --info:#7ea6ff; --info-soft:rgba(126,166,255,.15);
  --shadow:0 12px 40px rgba(0,0,0,.45);
  --f-display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#f3f5f6; --panel:#ffffff; --panel-2:#eef2f4; --line:#d9e1e6; --line-2:#c7d2d9;
  --fg:#111a20; --muted:#55666f; --faint:#8395a0;
  --accent:#e8960f; --accent-ink:#1b1204; --accent-soft:rgba(232,150,15,.14); --accent-text:#9a5b00;
  --volt:#0f8f88; --volt-soft:rgba(15,143,136,.12);
  --ok:#1d8a5a; --ok-soft:rgba(29,138,90,.12);
  --warn:#9a6700; --warn-soft:rgba(214,150,20,.16);
  --bad:#c93636; --bad-soft:rgba(201,54,54,.11);
  --info:#2d5fd3; --info-soft:rgba(45,95,211,.1);
  --shadow:0 12px 40px rgba(20,35,45,.16); color-scheme:light;}}
:root[data-theme="light"]{
  --bg:#f3f5f6; --panel:#ffffff; --panel-2:#eef2f4; --line:#d9e1e6; --line-2:#c7d2d9;
  --fg:#111a20; --muted:#55666f; --faint:#8395a0;
  --accent:#e8960f; --accent-ink:#1b1204; --accent-soft:rgba(232,150,15,.14); --accent-text:#9a5b00;
  --volt:#0f8f88; --volt-soft:rgba(15,143,136,.12);
  --ok:#1d8a5a; --ok-soft:rgba(29,138,90,.12);
  --warn:#9a6700; --warn-soft:rgba(214,150,20,.16);
  --bad:#c93636; --bad-soft:rgba(201,54,54,.11);
  --info:#2d5fd3; --info-soft:rgba(45,95,211,.1);
  --shadow:0 12px 40px rgba(20,35,45,.16); color-scheme:light;}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent-text)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,td.n,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* shell */
.app{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:14px 12px calc(14px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.brand{display:flex;align-items:center;gap:10px;padding:4px 6px 14px;border-bottom:1px solid var(--line);margin-bottom:10px}
.mark{width:38px;height:38px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:800 13px/1 var(--f-display);letter-spacing:-.02em;position:relative}
.mark svg{position:absolute;right:-4px;bottom:-4px;width:16px;height:16px;fill:var(--accent);stroke:var(--panel);stroke-width:1.6}
.brand b{font:700 15px/1.1 var(--f-display);display:flex;gap:6px;align-items:center}
.brand small{color:var(--muted);font-size:11.5px}
.tag-beta{font:600 9.5px/1 var(--f-body);letter-spacing:.06em;background:var(--accent-soft);color:var(--accent-text);padding:3px 5px;border-radius:4px}
.nav{display:flex;flex-direction:column;gap:1px}
.nav .grp{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);padding:12px 10px 4px}
.nav a{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:8px;color:var(--fg);text-decoration:none;opacity:.86}
.nav a:hover{background:var(--panel-2);opacity:1}
.nav a.on{background:var(--accent-soft);color:var(--accent-text);opacity:1;font-weight:600}
.nav a .cnt{margin-left:auto;font:500 11px var(--f-mono);color:var(--muted)}
.side-foot{margin-top:auto;padding-top:12px}
.side-foot .box{border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:12px;color:var(--muted);display:grid;gap:4px}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.crumb{min-width:0}
.crumb small{display:block;color:var(--muted);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.crumb h1{font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sp{flex:1}
.gs{position:relative;width:min(380px,40vw)}
.gs input{width:100%;padding:8px 12px 8px 34px;background:var(--panel);border:1px solid var(--line);border-radius:9px}
.gs input#gsearch{padding-left:34px}
.gs svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted)}
.drop{position:absolute;right:0;top:calc(100% + 6px);width:min(420px,92vw);background:var(--panel);border:1px solid var(--line-2);border-radius:12px;box-shadow:var(--shadow);max-height:60vh;overflow:auto;z-index:40;padding:6px}
.drop .it{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:8px;cursor:pointer;width:100%;text-align:left;background:none;border:0}
.drop .it:hover{background:var(--panel-2)}
.drop .it small{color:var(--muted);display:block}
.drop .empty{padding:14px;color:var(--muted)}
.iconbtn{position:relative;display:grid;place-items:center;width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--panel);cursor:pointer}
.iconbtn:hover{border-color:var(--line-2)}
.iconbtn .dot{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;border-radius:9px;background:var(--bad);color:#fff;font:600 10.5px/18px var(--f-mono);padding:0 5px}
.menu-btn{display:none}
.content{padding-block:22px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));width:100%;max-width:1480px;display:grid;grid-template-columns:minmax(0,1fr);gap:18px;align-content:start}
.content>*{min-width:0}
.demo-band{display:flex;gap:10px;align-items:center;flex-wrap:wrap;border:1px dashed var(--line-2);border-radius:10px;padding:8px 12px;font-size:12.5px;color:var(--muted)}

/* page head */
.ph{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.ph .t{flex:1;min-width:220px}
.ph h2{font-size:22px}
.ph p{margin:2px 0 0;color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 13px;border-radius:9px;border:1px solid var(--line-2);background:var(--panel);cursor:pointer;font-weight:500;white-space:nowrap;text-decoration:none;color:var(--fg)}
.btn:hover{background:var(--panel-2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.pri:hover{filter:brightness(1.06)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}
.btn.danger:hover{background:var(--bad-soft)}
.btn.wa{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,var(--line))}
.btn.sm{padding:5px 9px;font-size:12.5px;border-radius:7px;gap:5px}
.btn.sm svg.i{width:15px;height:15px}
.btn.ic{padding:6px;border-radius:7px}
.btn[disabled]{opacity:.45;pointer-events:none}

/* cards & kpis */
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.card>h3{font-size:14.5px;margin-bottom:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card>h3 .sp{flex:1}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:4px;min-width:0}
.kpi .l{color:var(--muted);font-size:12.5px;display:flex;justify-content:space-between;gap:8px}
.kpi .v{font:600 clamp(18px,1.55vw,24px)/1.15 var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kpi .s{font-size:12px;color:var(--muted)}
.kpi.k-ok{border-color:color-mix(in srgb,var(--ok) 40%,var(--line))}.kpi.k-ok .v{color:var(--ok)}
.kpi.k-warn{border-color:color-mix(in srgb,var(--warn) 40%,var(--line))}.kpi.k-warn .v{color:var(--warn)}
.kpi.k-bad{border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}.kpi.k-bad .v{color:var(--bad)}
.kpi.k-acc .v{color:var(--accent-text)}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.grid-side{display:grid;grid-template-columns:minmax(300px,380px) minmax(0,1fr);gap:16px;align-items:start}

/* pills */
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap;background:var(--panel-2);color:var(--muted);border:1px solid transparent}
.p-ok{background:var(--ok-soft);color:var(--ok)}.p-warn{background:var(--warn-soft);color:var(--warn)}.p-bad{background:var(--bad-soft);color:var(--bad)}.p-info{background:var(--info-soft);color:var(--info)}.p-acc{background:var(--accent-soft);color:var(--accent-text)}.p-volt{background:var(--volt-soft);color:var(--volt)}
.svc{display:inline-flex;align-items:center;gap:6px;font-size:12px;white-space:nowrap;color:var(--fg)}
.svc i{width:8px;height:8px;border-radius:2px;display:inline-block;flex:none}

/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
table{width:100%;border-collapse:collapse;min-width:760px}
th{text-align:left;font:600 10.5px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line);background:var(--panel-2);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:color-mix(in srgb,var(--panel-2) 55%,transparent)}
td small,.sub{display:block;color:var(--muted);font-size:12px}
td.act{white-space:nowrap;text-align:right}
td.act .row{justify-content:flex-end;flex-wrap:nowrap;gap:5px}
td.empty{text-align:center;color:var(--muted);padding:30px}
tr.done td{opacity:.6}
tr.done td .tt{text-decoration:line-through}

/* forms */
.fg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fg .s2{grid-column:span 2}
.fld{display:grid;gap:5px;min-width:0}
.fld>span{font-size:12.5px;color:var(--muted);font-weight:500}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=tel],input[type=email],input[type=search],select,textarea{width:100%;padding:8px 10px;background:var(--bg);border:1px solid var(--line-2);border-radius:8px;min-width:0}
textarea{resize:vertical;min-height:84px}
input[type=color]{width:100%;height:38px;border:1px solid var(--line-2);border-radius:8px;background:var(--bg);padding:3px}
input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px}
.filters{display:grid;grid-template-columns:2fr repeat(3,minmax(0,1fr));gap:12px;align-items:end}
.hint{font-size:12px;color:var(--muted)}
.sec-t{font:600 11px var(--f-body);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:6px 0 -2px;grid-column:1/-1;border-top:1px solid var(--line);padding-top:12px}

/* progress */
.bar{height:6px;border-radius:3px;background:var(--panel-2);overflow:hidden;min-width:70px}
.bar>i{display:block;height:100%;background:var(--volt);border-radius:3px}
.prog{display:grid;gap:4px;min-width:90px}
.prog b{font:500 12.5px var(--f-mono)}

/* kanban */
.kan{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,1fr);gap:12px;overflow-x:auto;padding-bottom:8px;align-items:start}
.col{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;display:grid;gap:8px;align-content:start;min-height:220px}
.col.over{border-color:var(--accent);background:var(--accent-soft)}
.col-h{display:flex;gap:8px;align-items:flex-start;padding:2px 2px 6px;border-bottom:1px solid var(--line)}
.col-h b{font:600 13.5px var(--f-display);display:block}
.col-h small{color:var(--muted);font-size:11.5px;line-height:1.35;display:block}
.col-h .cnt{margin-left:auto;font:600 11.5px var(--f-mono);background:var(--panel-2);border-radius:6px;padding:2px 7px}
.col-h .tot{font:500 11px var(--f-mono);color:var(--muted)}
.kc{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:10px;display:grid;gap:6px;cursor:grab}
.kc:active{cursor:grabbing}
.kc .h{display:flex;gap:6px;align-items:flex-start}
.kc .h b{flex:1;font-weight:600;line-height:1.3}
.kc .meta{display:flex;flex-wrap:wrap;gap:4px}
.kc .meta span{font-size:11px;border:1px solid var(--line-2);border-radius:5px;padding:1px 6px;color:var(--muted)}
.kc .nx{font-size:11.5px;color:var(--muted)}
.kc .nx.late{color:var(--bad)}
.col .none{border:1px dashed var(--line-2);border-radius:10px;padding:18px;text-align:center;color:var(--faint);font-size:12.5px}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--line);gap:1px}
.cal .dh{background:var(--panel-2);text-align:center;font:600 10.5px var(--f-body);letter-spacing:.08em;color:var(--muted);padding:8px 0}
.cal .d{background:var(--panel);min-height:108px;padding:6px;display:flex;flex-direction:column;gap:4px;min-width:0}
.cal .d.out{background:var(--bg)}
.cal .d.out .dn{color:var(--faint)}
.cal .d.today{box-shadow:inset 0 0 0 2px var(--accent)}
.cal .d .dt{display:flex;justify-content:space-between;align-items:center}
.cal .dn{font:500 12px var(--f-mono)}
.cal .add{border:0;background:none;color:var(--muted);cursor:pointer;padding:0 3px;font-size:16px;line-height:1}
.ev{border-left:3px solid var(--volt);background:var(--panel-2);border-radius:5px;padding:3px 6px;font-size:11.5px;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left;border-top:0;border-right:0;border-bottom:0;width:100%}
.ev b{font-family:var(--f-mono);font-weight:500}
.ev.cancel{text-decoration:line-through;opacity:.6}

/* bars chart */
.hb{display:grid;gap:9px}
.hb .r{display:grid;grid-template-columns:150px minmax(0,1fr) auto;gap:10px;align-items:center;font-size:12.5px}
.hb .r .tr{height:12px;background:var(--panel-2);border-radius:3px;overflow:hidden}
.hb .r .tr i{display:block;height:100%;border-radius:3px}
.hb .r .vv{font:500 12px var(--f-mono);color:var(--fg);min-width:70px;text-align:right}
.vb{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:10px;align-items:end;height:200px;padding-top:16px;border-bottom:1px solid var(--line-2)}
.vb .c{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:4px;min-width:0}
.vb .c i{width:100%;max-width:44px;background:var(--volt);border-radius:4px 4px 0 0;min-height:2px}
.vb .c i.pend{background:color-mix(in srgb,var(--accent) 70%,transparent)}
.vb .c span{font:500 10.5px var(--f-mono);color:var(--muted);white-space:nowrap}
.vlab{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:10px;font:500 11px var(--f-mono);color:var(--muted);text-align:center;padding-top:6px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

/* lists */
.lst{display:grid;gap:2px}
.lst .li{display:flex;gap:10px;align-items:center;padding:8px 6px;border-bottom:1px solid var(--line);min-width:0}
.lst .li:last-child{border-bottom:0}
.lst .li .tx{flex:1;min-width:0}
.lst .li .tx b{font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lst .li .tx small{color:var(--muted);font-size:12px}
.lst .empty{color:var(--muted);padding:12px 6px}
.sev{width:4px;align-self:stretch;border-radius:2px;background:var(--line-2);flex:none}
.sev.bad{background:var(--bad)}.sev.warn{background:var(--warn)}.sev.info{background:var(--info)}.sev.ok{background:var(--ok)}

/* modal */
.ov{position:fixed;inset:0;background:rgba(5,9,12,.62);z-index:100;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:max(24px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 24px max(12px,env(safe-area-inset-left,0px))}
.md{background:var(--panel);border:1px solid var(--line-2);border-radius:14px;box-shadow:var(--shadow);width:min(720px,100%);display:flex;flex-direction:column;margin:auto 0}
.md.wide{width:min(1040px,100%)}
.md-h{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.md-h h3{flex:1;font-size:16px}
.md-b{padding:16px;display:grid;gap:14px}
.md-f{display:flex;gap:8px;justify-content:flex-end;padding:12px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.toast{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:200;background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:10px;font-weight:500;box-shadow:var(--shadow);max-width:calc(100vw - 32px)}

/* itens orcamento */
.items{display:grid;gap:6px}
.items .ir{display:grid;grid-template-columns:minmax(0,3fr) 70px 64px 120px 110px 34px;gap:6px;align-items:center}
.items .ir.h{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.items .ir .tot{font:500 12.5px var(--f-mono);text-align:right}
.calc{border:1px solid color-mix(in srgb,var(--accent) 35%,var(--line));background:var(--accent-soft);border-radius:12px;padding:14px;display:grid;gap:12px}
.calc h4{margin:0;font:600 13.5px var(--f-display);display:flex;gap:8px;align-items:center}
.calc-out{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.calc-out div{background:var(--panel);border-radius:8px;padding:8px 10px}
.calc-out small{display:block;color:var(--muted);font-size:11.5px}
.calc-out b{font:600 14px var(--f-mono);overflow-wrap:anywhere}
.totbox{display:grid;gap:4px;justify-items:end;font-size:13px}
.totbox b{font:600 20px var(--f-mono)}

/* proposta */

/* ---------- cálculos ---------- */
function orcSub(o) { return sum(o.itens || [], i => (+i.q || 0) * (+i.v || 0)); }
function orcTotal(o) { return Math.round(orcSub(o) * (1 - (+o.descPct || 0) / 100) * 100) / 100; }
function pagSt(p) { return p.pagoEm ? 'pago' : (p.venc < today() ? 'vencido' : 'pendente'); }
function orcPago(o) { return sum(db.pags.filter(p => p.orcId === o.id && p.pagoEm), p => p.valor); }
function orcVencido(o) { return sum(db.pags.filter(p => p.orcId === o.id && pagSt(p) === 'vencido'), p => p.valor); }
function cliente(id) { return byId(db.leads, id) || {}; }
function pesos(pid) {
  const ts = db.tarefas.filter(t => t.projetoId === pid);
  const isMan = t => t.peso !== null && t.peso !== '' && t.peso !== undefined;
  const sug = ts.filter(t => !isMan(t) && t.pesoSug);
  const M = sum(ts.filter(isMan), t => t.peso);
  const auto = ts.filter(t => !isMan(t));
  const sugTot = sum(sug, t => t.pesoSug);
  const rest = Math.max(0, 100 - M);
  return ts.map(t => {
    let w;
    if (isMan(t)) w = +t.peso;
    else if (sug.length === auto.length && sugTot > 0) w = rest * t.pesoSug / sugTot;
    else w = auto.length ? rest / auto.length : 0;
    return { t, w, man: isMan(t) };
  });
}
function progresso(p) {
  if (p.status === 'concluido') return 100;
  const ws = pesos(p.id); const tot = sum(ws, x => x.w);
  if (!tot) return 0;
  return Math.round(sum(ws.filter(x => x.t.done), x => x.w) / tot * 100);
}
function calcSolar(consumo, hsp, pr, pot) {
  consumo = +consumo || 0; hsp = +hsp || db.cfg.hsp; pr = +pr || db.cfg.pr; pot = +pot || db.cfg.pot;
  if (!consumo) return null;
  const kwpAlvo = consumo / (hsp * 30 * pr);
  const mod = Math.ceil(kwpAlvo * 1000 / pot);
  const kwp = Math.round(mod * pot / 10) / 100;
  const ger = Math.round(kwp * hsp * 30 * pr);
  const valor = Math.round(kwp * 1000 * db.cfg.custoWp / 10) * 10;
  const comp = Math.min(ger, consumo);
  const eco = Math.round(comp * db.cfg.tarifa * (1 - db.cfg.fioB));
  const payback = eco ? Math.round(valor / (eco * 12) * 10) / 10 : 0;
  const inv = Math.max(3, Math.round(kwp / 1.15 / 5) * 5);
  return { consumo, hsp, pr, pot, mod, kwp, ger, valor, eco, payback, inv };
}

  openModal(title || 'Exportar', `<p class="hint" style="margin:0">Baixe o arquivo <b>${esc(name)}</b>. Se o download estiver bloqueado neste ambiente, copie o conteúdo abaixo e salve num arquivo com esse nome.</p>
    <textarea id="exptxt" rows="10" readonly class="mono" style="font-size:12px">${esc(text)}</textarea>`,
    { foot: `<button class="btn" data-act="copyexp">${ic('copy')}Copiar</button>${href ? `<a class="btn pri" href="${href}" download="${esc(name)}">${ic('download')}Baixar arquivo</a>` : ''}` });
}
function copyText(txt, el) {
  const fb = () => { if (el) { el.focus(); el.select(); } toast('Selecione e copie com Ctrl+C.'); };
  try { navigator.clipboard.writeText(txt).then(() => toast('Copiado.'), fb); } catch (e) { fb(); }
}

/* ---------- Reprospecção ---------- */
P.reprospeccao = () => {
  const t = today(), dias = +ui('r_d', db.cfg.cadencia), lim = addDays(t, -dias);
  const cont = db.contatos.filter(c => !c.arquivado && c.status === 'enviada' && ((c.proximo && c.proximo <= t) || (c.ultimoEnvio && c.ultimoEnvio.slice(0, 10) <= lim)));
  const leads = db.leads.filter(l => !l.arquivado && !['ganho', 'perdido'].includes(l.etapa) && ((l.proximo && l.proximo <= t) || (l.atualizado && l.atualizado <= lim)));
  const orcs = db.orcs.filter(o => !o.arquivado && ['enviado', 'negociacao'].includes(o.status) && (o.ultimoRetorno || o.criado) <= lim);
  const pars = db.parceiros.filter(p => !p.ultimo || p.ultimo <= addDays(t, -30));
  const antigos = db.leads.filter(l => l.etapa === 'ganho' && (l.atualizado || '') <= addDays(t, -180));
  const perd = db.leads.filter(l => l.etapa === 'perdido');
  const v = ui('r_v', 'orcs');
  const mL = modelosDe('reprospeccao')[0], mO = db.modelos.find(m => m.nome.startsWith('Cobrança de retorno')) || modelosDe('orcamento')[0];
  const q = ui('r_q', '');
  let body = '';
  if (v === 'orcs') body = `<table><thead><tr><th>Orçamento</th><th>Cliente</th><th>Valor</th><th>Último retorno</th><th>Validade</th><th>Status</th><th></th></tr></thead><tbody>${orcs.filter(o => has(q, o.numero, o.titulo, cliente(o.leadId).empresa)).map(o => { const c = cliente(o.leadId); return `<tr><td><b class="mono">${esc(o.numero)}</b><small>${esc(o.titulo)}</small></td><td>${esc(c.empresa)}</td><td class="n">${R(orcTotal(o))}</td><td class="n">${fD(o.ultimoRetorno)}<small>há ${diffDays(o.ultimoRetorno || o.criado, t)} dia(s)</small></td><td class="n">${fD(o.validade)}</td><td>${pill(OST, o.status)}</td><td class="act"><div class="row">${mO && c.telefone ? waA(waLink(c.telefone, fill(mO.texto, varsOrc(o))), 'Cobrar', `data-act="orcTouch" data-id="${o.id}"`) : ''}${btn('orcTouch', 'Registrar retorno', 'check', '', `data-id="${o.id}"`)}</div></td></tr>`; }).join('') || '<tr><td colspan="7" class="empty">Nenhum orçamento parado nessa lista.</td></tr>'}</tbody></table>`;
  else if (v === 'leads' || v === 'antigos' || v === 'perdidos') { const arr = v === 'leads' ? leads : v === 'antigos' ? antigos : perd; body = `<table><thead><tr><th>Lead</th><th>Serviço</th><th>Etapa</th><th>Próximo contato</th><th>Última atualização</th><th></th></tr></thead><tbody>${arr.filter(l => has(q, l.empresa, l.contato)).map(l => `<tr><td><b>${esc(l.empresa)}</b><small>${esc(l.contato)}${l.notas ? ' · ' + esc(l.notas) : ''}</small></td><td>${svcTag(l.servico)}</td><td>${etapaN(l.etapa)}</td><td class="n">${fD(l.proximo)}</td><td class="n">${fD(l.atualizado)}</td><td class="act"><div class="row">${mL && l.telefone ? waA(waLink(l.telefone, fill(mL.texto, varsContato(l))), 'Retomar', `data-act="leadTouch" data-id="${l.id}"`) : ''}${btn('leadTouch', 'Registrar contato', 'check', '', `data-id="${l.id}"`)}</div></td></tr>`).join('') || '<tr><td colspan="6" class="empty">Ninguém nessa lista.</td></tr>'}</tbody></table>`; }
  else if (v === 'contatos') body = `<table><thead><tr><th>Contato</th><th>Interesse</th><th>Envios</th><th>Último envio</th><th>Retornar em</th><th></th></tr></thead><tbody>${cont.filter(c => has(q, c.empresa, c.contato)).map(c => `<tr><td><b>${esc(c.empresa)}</b><small>${esc(c.contato)} · ${esc(c.cidade)}</small></td><td>${svcTag(c.servico)}</td><td class="n">${c.tentativas}</td><td class="n">${fDT(c.ultimoEnvio)}</td><td class="n">${fD(c.proximo)}</td><td class="act"><div class="row">${mL ? waA(waLink(c.telefone, fill(mL.texto, varsContato(c))), 'Reenviar', `data-act="cSent" data-id="${c.id}"`) : ''}${btn('cResp', 'Respondeu', 'check', '', `data-id="${c.id}"`)}</div></td></tr>`).join('') || '<tr><td colspan="6" class="empty">Nenhum contato aguardando retomada.</td></tr>'}</tbody></table>`;
  else body = `<table><thead><tr><th>Parceiro</th><th>Tipo</th><th>Último contato</th><th></th></tr></thead><tbody>${pars.filter(p => has(q, p.nome)).map(p => `<tr><td><b>${esc(p.nome)}</b><small>${esc(p.contato)}</small></td><td>${esc(p.tipo)}</td><td class="n">${fD(p.ultimo)}</td><td class="act"><div class="row">${p.telefone ? waA(waLink(p.telefone, `Olá, ${(p.contato || '').split(' ')[0]}! Tudo bem? Passando para alinhar novas oportunidades com a ${db.cfg.empresa}.`), 'Retomar', `data-act="parTouch" data-id="${p.id}"`) : ''}</div></td></tr>`).join('') || '<tr><td colspan="4" class="empty">Todos os parceiros com contato recente.</td></tr>'}</tbody></table>`;
  const k = (key, l, n) => `<button class="kpi" style="text-align:left;cursor:pointer;${v === key ? 'border-color:var(--accent)' : ''}" data-act="rView" data-v="${key}"><div class="l"><span>${l}</span></div><div class="v">${n}</div></button>`;
  return `<div class="ph"><div class="t"><h2>Reprospecção</h2><p>Quem precisa de retorno antes que a oportunidade esfrie.</p></div></div>
  <div class="kpis">${k('contatos', 'Contatos para retomar', cont.length)}${k('leads', 'Leads para retomar', leads.length)}${k('orcs', 'Orçamentos para cobrar', orcs.length)}${k('parceiros', 'Parceiros sem contato (30d)', pars.length)}${k('antigos', 'Clientes antigos (6m+)', antigos.length)}${k('perdidos', 'Perdidos para reativar', perd.length)}</div>
  <div class="card"><div class="filters" style="grid-template-columns:2fr 1fr 1fr">
    <label class="fld"><span>Busca</span><input type="search" id="r_q" data-f="r_q" data-full="1" value="${esc(q)}" placeholder="Nome ou número"></label>
    <label class="fld"><span>O que ver</span><select id="r_v" data-f="r_v" data-full="1">${opt([['orcs', 'Cobrar orçamentos parados'], ['leads', 'Leads sem retorno'], ['contatos', 'Contatos frios sem resposta'], ['parceiros', 'Parceiros'], ['antigos', 'Clientes antigos'], ['perdidos', 'Leads perdidos']], v)}</select></label>
    <label class="fld"><span>Parado há mais de (dias)</span><input id="r_d" type="number" min="1" data-f="r_d" data-full="1" value="${dias}"></label></div></div>
  <div class="tw">${body}</div>`;
};

  const cur = ps.find(p => p.id === ui('t_new', pid)) || ps.find(p => p.id === pid) || ps[0];
  const ws = cur ? pesos(cur.id) : []; const isMan = x => x.man;
  const restante = Math.max(0, 100 - sum(ws.filter(isMan), x => x.w));
  const autoN = ws.filter(x => !x.man).length + 1;
  return `<div class="ph"><div class="t"><h2>Tarefas</h2><p>Tarefas de cada projeto com prazo, prioridade e peso no progresso.</p></div>
    <div class="row"><select id="t_p" data-f="t_p" data-full="1" style="width:min(420px,100%)" aria-label="Filtrar por projeto">${opt([['', 'Todos os projetos'], ...ps.map(p => [p.id, `${p.codigo} – ${p.nome}`])], pid)}</select></div></div>

        <label class="fld"><span>Data</span><input id="tn_dt" type="date" value="${addDays(today(), 7)}"></label>
        <label class="fld"><span>Hora</span><input id="tn_h" type="time" value="09:00"></label>
        <label class="fld"><span>Prioridade</span><select id="tn_p">${opt([['baixa', 'Baixa'], ['normal', 'Normal'], ['alta', 'Alta']], 'normal')}</select></label>
        <label class="fld"><span>Peso (%)</span><input id="tn_w" type="number" min="0" max="100" placeholder="Automático"></label>
        <p class="hint s2" style="margin:0">Peso automático desta tarefa: ${N(restante / autoN, 1)}%. Restante automático do projeto: ${N(restante, 1)}%.</p>
      </div>` : '<p class="hint">Crie um projeto (ou aprove um orçamento) para lançar tarefas.</p>'}
    </div>
    <div id="pg-list" style="min-width:0">${P.tarefas.list()}</div>
  </div>`;
};
P.tarefas.list = () => {
  const pid = ui('t_p', ''), t = today();
  const ps = db.projetos.filter(p => !p.arquivado);
  const ts = db.tarefas.filter(x => (!pid || x.projetoId === pid) && ps.some(p => p.id === x.projetoId));
  const W = {}; ps.forEach(p => pesos(p.id).forEach(x => (W[x.t.id] = x)));
  ts.sort((a, b) => (a.done - b.done) || (a.data || '9').localeCompare(b.data || '9'));
  const PR = { alta: ['Alta', 'p-bad'], normal: ['Normal', ''], baixa: ['Baixa', 'p-volt'] };
  return `<div class="tw"><table style="min-width:680px"><thead><tr><th></th><th>Tarefa</th><th>Projeto</th><th>Prazo</th><th>Prioridade</th><th>Peso</th><th></th></tr></thead><tbody>
  ${ts.map(x => { const p = byId(db.projetos, x.projetoId), w = W[x.id] || { w: 0 }; return `<tr class="${x.done ? 'done' : ''}"><td><input type="checkbox" data-act="taskToggle" data-id="${x.id}" ${x.done ? 'checked' : ''} aria-label="Concluir"></td>

    <td class="act"><div class="row">${ibtn('editTask', 'edit', 'Editar', '', `data-id="${x.id}"`)}${ibtn('delTask', 'trash', 'Excluir', 'danger', `data-id="${x.id}"`)}</div></td></tr>`; }).join('') || '<tr><td colspan="7" class="empty">Nenhuma tarefa.</td></tr>'}
  </tbody></table></div>`;
};
const F_TASK = [{ k: 'titulo', label: 'Título', req: 1, span: 1 }, { k: 'desc', label: 'Descrição', type: 'textarea', span: 1 }, { k: 'data', label: 'Data', type: 'date' }, { k: 'hora', label: 'Hora', type: 'time' }, { k: 'prio', label: 'Prioridade', type: 'select', opts: [['baixa', 'Baixa'], ['normal', 'Normal'], ['alta', 'Alta']] }, { k: 'peso', label: 'Peso (%) – vazio = automático', type: 'number' }];

/* ---------- Relatórios ---------- */
P.relatorios = () => {
  const t = today(); const months = []; for (let i = -5; i <= 2; i++) months.push(addMonths(t.slice(0, 7) + '-01', i).slice(0, 7));
  const rec = months.map(m => ({ m, pago: sum(db.pags.filter(p => p.pagoEm && p.pagoEm.slice(0, 7) === m), p => p.valor), prev: sum(db.pags.filter(p => !p.pagoEm && p.venc.slice(0, 7) === m), p => p.valor) }));
  const mx = Math.max(1, ...rec.map(r => r.pago + r.prev));
  const ls = db.leads; const funil = ETAPAS.filter(e => e[0] !== 'perdido').map(([k, n], i, arr) => ({ n, c: ls.filter(l => arr.slice(i).some(e => e[0] === l.etapa)).length }));
  const fmx = Math.max(1, ...funil.map(f => f.c));
  const orig = ORIGENS.map(o => ({ o, n: ls.filter(l => l.origem === o).length, g: ls.filter(l => l.origem === o && l.etapa === 'ganho').length })).filter(x => x.n);
  const omx = Math.max(1, ...orig.map(x => x.n));
  const svc = Object.keys(SERV).map(k => ({ k, ap: sum(db.orcs.filter(o => o.servico === k && o.status === 'aprovado'), orcTotal), ab: sum(db.orcs.filter(o => o.servico === k && ['enviado', 'negociacao'].includes(o.status)), orcTotal) }));
  const smx = Math.max(1, ...svc.map(s => s.ap + s.ab));
  const kwp = sum(db.projetos.filter(p => ['solar', 'gd'].includes(p.servico)), p => p.kwp);
  const ger = kwp * db.cfg.hsp * 30 * db.cfg.pr;
  const perdidos = ls.filter(l => l.etapa === 'perdido').length, ganhos = ls.filter(l => l.etapa === 'ganho').length;
  return `<div class="ph"><div class="t"><h2>Relatórios</h2><p>Desempenho comercial, receita e capacidade instalada.</p></div></div>
  <div class="kpis">${kpi('Taxa de conversão de leads', (ganhos + perdidos) ? Math.round(ganhos / (ganhos + perdidos) * 100) + '%' : '—', `${ganhos} ganhos · ${perdidos} perdidos`)}${kpi('Potência FV contratada', N(kwp, 2) + ' kWp', `≈ ${N(ger)} kWh/mês gerados`, 'k-acc')}${kpi('CO₂ evitado (estimado)', N(ger * 12 * 0.0385 / 1000, 1) + ' t/ano', 'Fator médio SIN 0,0385 tCO₂/MWh')}${kpi('Receita recebida (total)', Rk(sum(db.pags.filter(p => p.pagoEm), p => p.valor)), '', 'k-ok')}</div>
  <div class="card"><h3>Fluxo de recebimentos <span class="sp"></span><span class="legend"><span><i style="background:var(--volt)"></i>Recebido</span><span><i style="background:color-mix(in srgb,var(--accent) 70%,transparent)"></i>A receber</span></span></h3>
    <div class="vb">${rec.map(r => `<div class="c" title="${r.m}: recebido ${R(r.pago)} · a receber ${R(r.prev)}"><span>${r.pago + r.prev ? Rk(r.pago + r.prev).replace('R$ ', '') : ''}</span>${r.prev ? `<i class="pend" style="height:${r.prev / mx * 85}%;border-radius:${r.pago ? '4px 4px 0 0' : '4px 4px 0 0'}"></i>` : ''}${r.pago ? `<i style="height:${r.pago / mx * 85}%;border-radius:${r.prev ? '0' : '4px 4px 0 0'}"></i>` : ''}</div>`).join('')}</div>
    <div class="vlab">${rec.map(r => `<span>${pd(r.m + '-01').toLocaleDateString('pt-BR', { month: 'short' }).replace('.', '')}/${r.m.slice(2, 4)}</span>`).join('')}</div></div>
  <div class="grid2">
    <div class="card"><h3>Funil acumulado</h3><div class="hb">${funil.map(f => `<div class="r"><span>${f.n}</span><div class="tr"><i style="width:${f.c / fmx * 100}%;background:var(--volt)"></i></div><span class="vv">${f.c}</span></div>`).join('')}</div><p class="hint" style="margin:10px 0 0">Quantos leads chegaram pelo menos até cada etapa.</p></div>
    <div class="card"><h3>Propostas por serviço <span class="sp"></span><span class="legend"><span><i style="background:var(--ok)"></i>Aprovado</span><span><i style="background:var(--line-2)"></i>Em análise</span></span></h3><div class="hb">${svc.map(s => `<div class="r"><span>${svcTag(s.k)}</span><div class="tr" style="display:flex"><i style="width:${s.ap / smx * 100}%;background:var(--ok);border-radius:3px 0 0 3px"></i><i style="width:${s.ab / smx * 100}%;background:var(--line-2);border-radius:0"></i></div><span class="vv">${Rk(s.ap + s.ab)}</span></div>`).join('')}</div></div>
  </div>
  <div class="card"><h3>Origem dos leads</h3><div class="hb">${orig.map(x => `<div class="r"><span>${esc(x.o)}</span><div class="tr"><i style="width:${x.n / omx * 100}%;background:var(--info)"></i></div><span class="vv">${x.n} <small style="color:var(--muted)">· ${x.g} ganho(s)</small></span></div>`).join('') || '<p class="hint">Sem leads ainda.</p>'}</div></div>`;
};

const CSV_HDR = 'empresa;contato;telefone;cidade;uf;segmento;interesse';
A.csvModelo = () => offerFile('modelo-captacao-f3f.csv', CSV_HDR + '\nFrigorífico Exemplo;João;+55 49 99999-0000;Lages;SC;Indústria;ml\nHotel Exemplo;Maria;49988887777;Urubici;SC;Hotelaria;solar\n', 'text/csv', 'Modelo de planilha');
A.importCsv = () => openModal('Importar planilha CSV', `<p class="hint" style="margin:0">Colunas: <span class="mono">${CSV_HDR}</span>. Separador ";" ou ",". Interesse: ${Object.keys(SERV).join(', ')}. Telefones repetidos são ignorados.</p>
  <label class="btn" style="justify-self:start">${ic('upload')}Escolher arquivo .csv<input type="file" accept=".csv,text/csv,text/plain" id="csvfile" hidden></label>
  <label class="fld"><span>Ou cole o conteúdo</span><textarea id="csvtxt" rows="8" class="mono" style="font-size:12px" placeholder="${CSV_HDR}"></textarea></label>`, { saveLbl: 'Importar', onSave: () => importCsv($('#csvtxt').value) });
function importCsv(txt) {
  const lines = String(txt || '').split(/\r?\n/).filter(l => l.trim()); if (!lines.length) return toast('Cole ou escolha um arquivo.');
  const sep = (lines[0].match(/;/g) || []).length >= (lines[0].match(/,/g) || []).length ? ';' : ',';
  const split = l => { const out = []; let cur = '', q = false; for (const ch of l) { if (ch === '"') q = !q; else if (ch === sep && !q) { out.push(cur); cur = ''; } else cur += ch; } out.push(cur); return out.map(s => s.trim()); };
  let hdr = split(lines[0]).map(norm); let start = 1;
  if (!hdr.includes('empresa')) { hdr = CSV_HDR.split(';'); start = 0; }
  const ix = k => hdr.indexOf(k);
  const tels = new Set(db.contatos.map(c => c.telefone.replace(/\D/g, '')));
  let novos = 0, dup = 0;
  for (const l of lines.slice(start)) {
    const r = split(l); const g = k => ix(k) >= 0 ? (r[ix(k)] || '') : '';
    const tel = g('telefone'); const dg = tel.replace(/\D/g, '');
    if (!g('empresa') || !dg) continue;
    if (tels.has(dg)) { dup++; continue; } tels.add(dg);
    const sv = norm(g('interesse')); const servico = SERV[sv] ? sv : (Object.keys(SERV).find(k => norm(SERV[k].n).includes(sv) && sv) || 'solar');
    db.contatos.push({ id: uid(), empresa: g('empresa'), contato: g('contato'), telefone: tel, cidade: g('cidade'), uf: g('uf') || db.cfg.uf, segmento: g('segmento'), servico, status: 'captado', tentativas: 0, ultimoEnvio: '', proximo: '', arquivado: false, criado: today() });
    novos++;
  }
  save(); closeModal(); toast(`${novos} contato(s) importado(s). ${dup} duplicado(s) ignorado(s).`); render();
}

function restore(txt) { try { const o = JSON.parse(txt); if (!o || !o.cfg || !Array.isArray(o.leads)) throw 0; db = o; const b = blank(); for (const k of Object.keys(b)) if (db[k] == null) db[k] = b[k]; save(); closeModal(); toast('Backup restaurado.'); render(); } catch (e) { toast('Arquivo inválido. Use um backup exportado por este CRM.'); } }
A.wipe = () => confirmBox('Apagar todos os leads, orçamentos, pagamentos, projetos e tarefas? Essa ação não tem volta.', () => { const cfg = db.cfg, mods = db.modelos; db = blank(); db.cfg = Object.assign(cfg, { seqOrc: 1, seqPrj: 1 }); db.modelos = mods; }, 'Apagar tudo');
A.reseed = () => confirmBox('Substituir os dados atuais pelos dados de demonstração?', () => { db = seed(); }, 'Recarregar');

/* handlers de change/input em elementos de tabela */
const CH = {};
CH.cStatus = el => { const c = byId(db.contatos, el.dataset.id); c.status = el.value; save(); refresh(); };
CH.prjStatus = el => { byId(db.projetos, el.dataset.id).status = el.value; save(); render(); };
CH.waModelo = el => { const m = byId(db.modelos, el.value); db.wa.modeloId = el.value; if (m) db.wa.texto = m.texto; save(); render(); };
CH.waTexto = el => { db.wa.texto = el.value; save(); const f = db.wa.fila.map(id => byId(db.contatos, id)).filter(Boolean)[0]; $('#wa_prev').textContent = fill(el.value, varsContato(f || { empresa: 'Frigorífico Exemplo', contato: 'João', cidade: 'Lages', uf: 'SC', segmento: 'Indústria', servico: 'solar' })); const a = $('[data-act="waSendNext"]'); if (a && f) a.href = waLink(f.telefone, fill(el.value, varsContato(f))); };
CH.waCad = el => { db.cfg.cadencia = Math.max(1, +el.value || 7); save(); };

/* ============================================================
   ROTEAMENTO E EVENTOS
   ============================================================ */
let route = 'dashboard';
function go(p) { if (!P[p]) p = 'dashboard'; route = p; try { history.replaceState(null, '', '#' + p); } catch (e) {} $('#app').classList.remove('open'); $('#scrim').hidden = true; $('#bdrop').hidden = true; $('#gdrop').hidden = true; render(); window.scrollTo(0, 0); }
function refresh() { const p = P[route]; const box = $('#pg-list'); if (p.list && box) box.innerHTML = p.list(); else render(); }
function render() {
  $('#nav').innerHTML = NAV.map(([g, items]) => `<div class="grp">${g}</div>` + items.map(([k, n]) => {
    const cnt = k === 'leads' ? db.leads.filter(l => !l.arquivado && !['ganho', 'perdido'].includes(l.etapa)).length : k === 'tarefas' ? db.tarefas.filter(t => !t.done && t.data && t.data < today()).length : k === 'whatsapp' ? db.wa.fila.length : '';
    return `<a href="#${k}" class="${route === k ? 'on' : ''}" data-act="go" data-p="${k}">${ic(k)}${n}${cnt ? `<span class="cnt">${cnt}</span>` : ''}</a>`; }).join('')).join('');
  $('#ptitle').textContent = TITLES[route];
  const al = alerts().filter(a => a.sev === 'bad' || a.sev === 'warn').length; const bc = $('#bellcnt'); bc.hidden = !al; bc.textContent = al;
  $('#sidefoot').innerHTML = `<span>${ic('backup')} Dados salvos neste navegador</span><span>Último backup: ${db.cfg.ultimoBackup ? fD(db.cfg.ultimoBackup.slice(0, 10)) : 'nunca'}</span><a href="#backup" data-act="go" data-p="backup">Fazer backup agora</a>`;
  const demo = db.demo ? `<div class="demo-band">${ic('info')}<span style="flex:1;min-width:200px">Você está vendo <b style="color:var(--fg)">dados de demonstração</b> (clientes e valores fictícios da Serra Catarinense). Quando quiser usar de verdade, apague e comece a cadastrar.</span><button class="btn sm" data-act="go" data-p="backup">Começar do zero</button></div>` : '';
  $('#content').innerHTML = demo + P[route]();
  if (route === 'captacao') gmUpdate();
  if (route === 'backup') { const f = $('#impfile'); f && f.addEventListener('change', () => readFile(f, restore)); }
}
function readFile(input, fn) { const f = input.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => fn(String(r.result)); r.readAsText(f, 'utf-8'); }
function gmUpdate() { const a = $('#gm_go'); if (!a) return; a.href = 'https://www.google.com/maps/search/' + encodeURIComponent(`${$('#gm_n').value} em ${$('#gm_c').value} ${$('#gm_u').value}`); }

document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t) { if (!e.target.closest('.gs')) $('#gdrop').hidden = true; if (!e.target.closest('[data-act="bell"]') && !e.target.closest('#bdrop')) $('#bdrop').hidden = true; return; }
  const fn = A[t.dataset.act]; if (!fn) return;
  if (t.tagName === 'A' && t.getAttribute('href')?.startsWith('#')) e.preventDefault();
  if (t.tagName === 'BUTTON' && t.closest('form')) e.preventDefault();
  fn(t.dataset, t, e);
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.f) { UI[t.dataset.f] = t.value; if (t.dataset.f === 'c_q' || t.dataset.f.startsWith('c_')) UI.csel = new Set(); t.dataset.full ? keepFocus(render, t.id) : refresh(); return; }
  if (t.dataset.actInput && CH[t.dataset.actInput]) return CH[t.dataset.actInput](t);
  if (t.closest('#items')) { syncItems(); const i = +t.dataset.i, it = draft.itens[i]; const el = $('#it_t' + i); if (el) el.textContent = R((+it.q || 0) * (+it.v || 0)); drawTot(); return; }
  if (t.dataset.k && route === 'captacao') { UI[t.dataset.k] = t.value; gmUpdate(); return; }
  if (['o_desc', 'o_ent', 'o_np'].includes(t.id)) return drawTot();
  if (['s_cons', 's_hsp', 's_pr', 's_pot'].includes(t.id)) return drawCalc();
  if (t.id === 'o_sv2') { $('#calcbox').hidden = !['solar', 'gd'].includes(t.value); drawCalc(); }
  if (t.id === 'o_lead') { const l = cliente(t.value); if (l.consumo && $('#s_cons') && !$('#s_cons').value) { $('#s_cons').value = l.consumo; drawCalc(); } if (l.servico) { $('#o_sv2').value = l.servico; $('#calcbox').hidden = !['solar', 'gd'].includes(l.servico); drawCalc(); } }
});
document.addEventListener('change', e => { const t = e.target; if (t.dataset.actChange && CH[t.dataset.actChange]) CH[t.dataset.actChange](t); if (t.id === 'csvfile') readFile(t, txt => { $('#csvtxt').value = txt; }); });
function keepFocus(fn, id) { const el = document.getElementById(id); const pos = el && el.selectionStart; fn(); const n = document.getElementById(id); if (n) { n.focus(); try { if (pos != null && n.setSelectionRange) n.setSelectionRange(pos, pos); } catch (e) {} } }
document.addEventListener('keydown', e => { if (e.key === 'Escape') { if ($('#modal').innerHTML) closeModal(); $('#gdrop').hidden = true; $('#bdrop').hidden = true; } });

/* drag and drop do funil */
let dragId = null;
document.addEventListener('dragstart', e => { const c = e.target.closest && e.target.closest('[data-drag]'); if (c) { dragId = c.dataset.drag; e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', dragId); } catch (x) {} } });
document.addEventListener('dragover', e => { const col = e.target.closest && e.target.closest('[data-drop]'); if (col && dragId) { e.preventDefault(); $$('.col.over').forEach(x => x !== col && x.classList.remove('over')); col.classList.add('over'); } });
document.addEventListener('drop', e => { const col = e.target.closest && e.target.closest('[data-drop]'); if (col && dragId) { e.preventDefault(); const l = byId(db.leads, dragId); if (l && l.etapa !== col.dataset.drop) { l.etapa = col.dataset.drop; l.atualizado = today(); save(); toast(`${l.empresa} → ${etapaN(l.etapa)}`); } dragId = null; refresh(); } });
document.addEventListener('dragend', () => { dragId = null; $$('.col.over').forEach(x => x.classList.remove('over')); });

/* busca global */
$('#gsearch').addEventListener('input', e => {
  const q = e.target.value.trim(); const d = $('#gdrop'); $('#bdrop').hidden = true;
  if (q.length < 2) { d.hidden = true; return; }
  const res = [
    ...db.leads.filter(l => has(q, l.empresa, l.contato, l.cidade, l.telefone)).map(l => ({ t: l.empresa, s: `Lead · ${SERV[l.servico]?.n || ''} · ${etapaN(l.etapa)}`, p: 'leads', k: 'l_q', v: l.empresa })),
    ...db.contatos.filter(c => has(q, c.empresa, c.contato, c.telefone)).map(c => ({ t: c.empresa, s: `Captação · ${CST[c.status]?.[0]}`, p: 'captacao', k: 'c_q', v: c.empresa })),
    ...db.orcs.filter(o => has(q, o.numero, o.titulo, cliente(o.leadId).empresa)).map(o => ({ t: `${o.numero} – ${o.titulo}`, s: `Orçamento · ${R(orcTotal(o))} · ${OST[o.status][0]}`, p: 'orcamentos', k: 'o_q', v: o.numero })),
    ...db.projetos.filter(p => has(q, p.codigo, p.nome)).map(p => ({ t: `${p.codigo} – ${p.nome}`, s: `Projeto · ${progresso(p)}%`, p: 'projetos' })),
    ...db.parceiros.filter(p => has(q, p.nome, p.contato)).map(p => ({ t: p.nome, s: `Parceiro · ${p.tipo}`, p: 'parceiros', k: 'pa_q', v: p.nome }))
  ].slice(0, 12);
  d.innerHTML = res.map((r, i) => `<button class="it" data-act="gpick" data-i="${i}"><span><b>${esc(r.t)}</b><small>${esc(r.s)}</small></span></button>`).join('') || '<div class="empty">Nada encontrado.</div>';
  UI.gres = res; d.hidden = false;
});
A.gpick = d => { const r = UI.gres[+d.i]; if (r.k) UI[r.k] = r.v; $('#gsearch').value = ''; $('#gdrop').hidden = true; go(r.p); };

/* init */
try { const th = localStorage.getItem(KEY + '-theme'); if (th) document.documentElement.dataset.theme = th; } catch (e) {}
load();
const h = (location.hash || '').slice(1);
go(P[h] ? h : 'dashboard');
save();
</script>
